# Seluruh stack dalam satu perintah: `docker compose up -d --build`. Variabel dibaca dari .env di root repo.
#
# Jaringan: antarlayanan memakai jaringan internal compose dengan nama layanan (db:5432, rustfs:9000).
# Port host hanya untuk akses dari luar Docker. Template per layanan:
#   ports:
#     - "127.0.0.1:<port host>:<port container>"   # hanya mesin ini
#     - "<port host>:<port container>"             # terbuka ke jaringan (LAN/HP)
# Hapus `#` di baris yang ingin dibuka, lalu `docker compose up -d` lagi.
services:
  app:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      # Alamat internal menimpa nilai localhost di .env. BETTER_AUTH_URL dan S3_PUBLIC_URL tetap dari .env
      # karena dipakai browser.
      DATABASE_URL: postgres://${POSTGRES_USER:-itapp}:${POSTGRES_PASSWORD:-itapp}@db:5432/${POSTGRES_DB:-itapp}
      S3_ENDPOINT: http://rustfs:9000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  # Sekali jalan: migrasi drizzle sebelum aplikasi start.
  migrate:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: deps
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-itapp}:${POSTGRES_PASSWORD:-itapp}@db:5432/${POSTGRES_DB:-itapp}
    # .env dibaca skrip seed (`tsx --env-file`); DATABASE_URL di atas tetap menang (tidak ditimpa).
    volumes:
      - ./.env:/repo/.env:ro
    command: ["pnpm", "--filter", "@workspace/db", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy

  # Pekerjaan cron (push:reminder, report:freeze, dst.); tidak ikut `up`, dipanggil dari crontab host:
  #   docker compose run --rm -T tasks pnpm --filter admin push:reminder
  # Lihat docs/operasional-cron.md.
  tasks:
    profiles: [tasks]
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: deps
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-itapp}:${POSTGRES_PASSWORD:-itapp}@db:5432/${POSTGRES_DB:-itapp}
      S3_ENDPOINT: http://rustfs:9000
    # Skrip memakai `tsx --env-file=../../.env`; variabel di atas tetap menang.
    volumes:
      - ./.env:/repo/.env:ro
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itapp}
      POSTGRES_DB: ${POSTGRES_DB:-itapp}
    # Internal saja. Buka bila menjalankan `pnpm dev` dari host atau memakai alat DB.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itapp} -d ${POSTGRES_DB:-itapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Server S3 (RustFS, pengganti MinIO yang image-nya tidak lagi tersedia). Aplikasi hanya memakai API S3.
  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      # Konsol hanya dibuka di localhost; jangan biarkan bawaan "*".
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:9001
    ports:
      # 9000 = API S3, WAJIB terjangkau browser (URL bertanda tangan = S3_PUBLIC_URL). 9001 = konsol.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sekali jalan: bucket privat + CORS yang hanya mengizinkan origin aplikasi (browser mengunggah langsung).
  rustfs-init:
    image: amazon/aws-cli:2.41.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-konten}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    entrypoint: >
      /bin/sh -c '
      s3="aws --endpoint-url http://rustfs:9000 s3api";
      $$s3 head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || $$s3 create-bucket --bucket "$$S3_BUCKET";
      $$s3 put-bucket-cors --bucket "$$S3_BUCKET" --cors-configuration "{\"CORSRules\":[{\"AllowedOrigins\":[\"$$APP_ORIGIN\"],\"AllowedMethods\":[\"GET\",\"HEAD\",\"POST\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\",\"Content-Length\",\"Content-Range\"],\"MaxAgeSeconds\":3600}]}"
      && echo "bucket $$S3_BUCKET siap, CORS: $$APP_ORIGIN"'

volumes:
  pgdata:
  rustfsdata:
