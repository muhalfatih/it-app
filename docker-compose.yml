# PostgreSQL untuk pengembangan lokal. Variabel dibaca dari .env di root repo.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itapp}
      POSTGRES_DB: ${POSTGRES_DB:-itapp}
    ports:
      # Hanya bisa diakses dari mesin ini.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itapp} -d ${POSTGRES_DB:-itapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
